[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-lab"
version = "0.1.0"
description = "Local CLI for full-band stem extraction and remix sessions (Demucs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Brandon Charleson" }]
keywords = ["demucs", "stems", "audio", "remix", "source-separation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Environment :: Console",
]
dependencies = [
    "demucs>=4.0.1",
    "soundfile>=0.14.0",
    "torchcodec>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
accompany = ["librosa>=0.10"]

[project.scripts]
stem-lab = "stemlab.cli:main"

[project.urls]
Homepage = "https://github.com/bcharleson/stem-lab"
Issues = "https://github.com/bcharleson/stem-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
